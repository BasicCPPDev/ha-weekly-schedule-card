<!doctype html>
<!-- Page d'essai hors HA : faux objet hass (entités de la prise programmable), servie par un serveur local.
     Paramètres : ?lang=en|fr  &dark=1  &mode=manual  &override=1
     &click=rule|add|toggle|conflict|power  (ouvre une fenêtre ou agit, pour la capture ; résultat dans body[data-resultat]) -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --primary-color: #03a9f4; --primary-text-color: #212121; --secondary-text-color: #727272;
    --divider-color: #e0e0e0; --card-background-color: #fff; --secondary-background-color: #f5f5f5;
    --error-color: #db4437; --success-color: #43a047; --warning-color: #ffa600; --text-primary-color: #fff;
    --state-switch-on-color: #fdd835; }
  :root.dark { --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --divider-color: #3a3a3a;
    --card-background-color: #1c1c1c; --secondary-background-color: #2b2b2b; }
  body { margin: 0; padding: 16px; background: #fafafa; font-family: Roboto, Arial, sans-serif; max-width: 480px; }
  :root.dark body { background: #111; }
</style>
<script>
  customElements.define('ha-card', class extends HTMLElement {
    connectedCallback() {
      Object.assign(this.style, { display: 'block', background: 'var(--card-background-color)', borderRadius: '12px',
        boxShadow: '0 2px 4px rgba(0,0,0,.15)', color: 'var(--primary-text-color)' });
    }
  });
</script>
</head>
<body>
<weekly-schedule-card id="card"></weekly-schedule-card>
<script type="module">
  import '../ha-weekly-schedule-card.js';
  const q = new URLSearchParams(location.search);
  if (q.get('dark')) document.documentElement.classList.add('dark');
  const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
  // Règles de la TP-Link (application Kasa), désactivées comprises
  const tplink = ['#03:00/ON #06:00/OFF 07:00/ON 10:30/OFF', '#06:00/OFF 10:30/OFF', '#03:00/ON #06:00/OFF 07:00/ON 10:30/OFF',
    '#03:00/ON #06:00/OFF 07:00/ON 10:30/OFF', '#06:00/OFF #07:00/ON #09:00/OFF 10:30/OFF',
    '#03:00/ON #06:00/OFF 07:00/ON 10:30/OFF', '#06:00/OFF #07:00/ON 10:30/OFF'];
  const st = (state, attrs = {}) => ({ state, attributes: attrs });
  const states = {
    'switch.prise_programmable': st('on', { friendly_name: 'Prise programmable' }),
    'select.prise_programmable_mode': st(q.get('mode') ?? 'auto'),
    'binary_sensor.prise_programmable_override': st(q.get('override') ? 'on' : 'off'),
    'sensor.prise_programmable_next_change': st('2026-10-08 07:00'),
  };
  days.forEach((d, i) => { states[`text.prise_programmable_schedule_${d}`] = st(tplink[i]); });
  const entities = Object.fromEntries(Object.keys(states).map((id) => [id, { entity_id: id, device_id: 'dev1' }]));
  const card = document.getElementById('card');
  let hass;
  const ecrits = [];                   // appels de services, pour les essais
  const update = () => { hass = { states: { ...states }, entities, locale: { language: q.get('lang') ?? 'fr' }, callService }; card.hass = hass; };
  async function callService(domain, service, data) {
    console.log('callService', domain, service, JSON.stringify(data));
    ecrits.push([domain, service, data]);
    if (domain === 'text') states[data.entity_id] = st(data.value);
    if (domain === 'select') states[data.entity_id] = st(data.option);
    if (domain === 'switch') states[data.entity_id] = st(states[data.entity_id].state === 'on' ? 'off' : 'on', states[data.entity_id].attributes);
    setTimeout(update, 300);
  }
  card.setConfig({ type: 'custom:weekly-schedule-card', entity: 'switch.prise_programmable' });
  update();
  const click = q.get('click');
  const resultat = (v) => { document.body.dataset.resultat = JSON.stringify(v); };
  setTimeout(() => {
    const r = card.shadowRoot;
    if (click === 'rule') r.querySelectorAll('[data-rule]')[3].click();          // vendredi + dimanche 07:00, désactivée
    if (click === 'add') r.querySelector('[data-act="add"]').click();
    if (click === 'toggle') {          // active la règle ven. + dim. 07:00 : deux jours écrits, fusion avec lun/mer/jeu/sam
      r.querySelectorAll('[data-rule]')[3].querySelector('input').click();
      setTimeout(() => resultat({ ecrits: ecrits.map((a) => a[2]), regles: card.shadowRoot.querySelectorAll('[data-rule]').length,
        statut: card.shadowRoot.querySelector('.status')?.textContent ?? '' }), 1000);
    }
    if (click === 'power') {           // interrupteur de la prise : actif en manuel, inactif (grisé) en auto
      const sw = r.querySelector('[data-act="toggle"]');
      sw.click();
      setTimeout(() => resultat({ desactive: sw.disabled, ecrits: ecrits.map((a) => `${a[0]}.${a[1]}`),
        etat: card.shadowRoot.querySelector('.power span').textContent }), 1000);
    }
    if (click === 'conflict') {        // nouvelle règle 07:00 OFF activée le lundi : conflit avec 07:00 ON
      r.querySelector('[data-act="add"]').click();
      const d = card.shadowRoot.querySelector('.dialog');
      d.querySelector('[name="time"]').value = '07:00';
      d.querySelector('[data-on="0"]').click();
      card.shadowRoot.querySelector('[data-preset="01234"]').click();
      card.shadowRoot.querySelector('[data-dlg="ok"]').click();
      resultat({ erreur: card.shadowRoot.querySelector('.dialog .err')?.textContent ?? '', ecrits: ecrits.length });
    }
    document.title = 'pret';
  }, 200);
</script>
</body>
</html>
